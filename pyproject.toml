[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-student"
version = "1.0.0"
description = "AI学生 - Windows 桌面端角色扮演 AI Agent：自动听课、记录课堂、完成老师布置的任务"
requires-python = ">=3.10"
readme = "README.md"

[project.scripts]
ai-student = "ai_student.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
